services:
  ipfs-node:
    image: ipfs/kubo:v0.32.1
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080"

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8181
      --project=ian-knowledge-mgmt
    ports:
      - "8181:8181"

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
      args:
        SERVICE_DIR: api-server
    ports:
      - "8000:8080"
      - "9000:9000"
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8181
      IPFS_API_URL: ""
      IPFS_GATEWAY_URL: https://ipfs.io/ipfs/
      P2P_NODE_ID: api-server
      P2P_PORT: 9000
      P2P_ADVERTISE_HOST: api-server
    depends_on:
      - firestore-emulator
      - ipfs-node

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      args:
        SERVICE_DIR: orchestrator
    ports:
      - "8001:8080"
      - "9001:9000"
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8181
      IPFS_API_URL: ""
      P2P_NODE_ID: orchestrator
      P2P_PORT: 9000
      P2P_ADVERTISE_HOST: orchestrator
    depends_on:
      - firestore-emulator

  llm-worker:
    build:
      context: .
      dockerfile: llm-worker/Dockerfile
      args:
        SERVICE_DIR: llm-worker
    ports:
      - "8002:8080"
      - "9002:9000"
      - "4012:4001"
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8181
      IPFS_API_URL: http://ipfs-node:5001/api/v0
      IPFS_GATEWAY_URL: http://ipfs-node:8080/ipfs/
      P2P_NODE_ID: llm-worker
      P2P_PORT: 9000
      P2P_ADVERTISE_HOST: llm-worker
    depends_on:
      - firestore-emulator
      - ipfs-node

  library-worker:
    build:
      context: .
      dockerfile: library-worker/Dockerfile
      args:
        SERVICE_DIR: library-worker
    ports:
      - "8003:8080"
      - "9003:9000"
      - "4013:4001"
    env_file: .env
    environment:
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8181
      IPFS_API_URL: http://ipfs-node:5001/api/v0
      IPFS_CLI_API: /dns4/ipfs-node/tcp/5001
      IPFS_GATEWAY_URL: http://ipfs-node:8080/ipfs/
      P2P_NODE_ID: library-worker
      P2P_PORT: 9000
      P2P_ADVERTISE_HOST: library-worker
    depends_on:
      - firestore-emulator
